    pivot: base
    limite_triangulos: 2800
    material: opaque
    qualidade: standard
    quantidade_cena: 2
    render_fidelity_roblox: Precise
    suavizacao_normais:
      modo: hard_surface
      angulo_graus: 52
      weighted_normals: false
      corrective_smooth: false
    colisao: box
    seed: 20261113
