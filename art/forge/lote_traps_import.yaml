# Forge3D 0.9.0 — rota `import`: armadilhas L1-L5 AA (art/scripts/make_traps.py)
# GERADO por art/scripts/lowpoly_lib.py (tools/art-pipeline.sh). Nao editar a mao:
# altura_metros = altura exportada em studs x 0,28 (perfil roblox-aa-80).
schema: forge3d/spec@6

projeto: muralha
perfil: roblox-aa-80
destino_exportacao: ~/.local/state/forge3d/saida/muralha_traps
estilo_global: stylized_pbr

orcamento_cena:
  triangulos_max: 400000
  draw_calls_max: 400
  vram_mb_max: 200

roblox_render:
  lighting_technology: Future
  render_fidelity_padrao: Precise
  surface_appearance: true
  strip_embedded_textures_glb: true

politica:
  falha: continuar
  custo_max_min: 30
  seed_base: 20261113

lote:
  - id: trap.archer.l1.01
    tipo: prop_estatico
    rota: import
    origem: art/export/trap_archer_l1.glb
    altura_metros: 1.442   # 5.1499 studs
    pivot: base
    limite_triangulos: 5600
    material: opaque
    qualidade: hero
    quantidade_cena: 1
    render_fidelity_roblox: Precise
    suavizacao_normais:
      modo: hard_surface
      angulo_graus: 46
      weighted_normals: true
      corrective_smooth: false
    colisao: box
    seed: 20261113
    lod: [100]
    tags: [muralha, trap, archer, l1]

