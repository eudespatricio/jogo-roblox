# Forge3D 0.9.0 — rota `import`: portal da fenda + 5 portais monumentais da campanha (art/scripts/make_portal.py)
# GERADO por art/scripts/lowpoly_lib.py (tools/art-pipeline.sh). Nao editar a mao:
# altura_metros = altura exportada em studs x 0,28 (perfil roblox-aa-80).
schema: forge3d/spec@6

projeto: muralha
perfil: roblox-aa-80
destino_exportacao: ~/.local/state/forge3d/saida/muralha_portal
estilo_global: stylized_pbr

orcamento_cena:
  triangulos_max: 400000
  draw_calls_max: 400
  vram_mb_max: 200

roblox_render:
  lighting_technology: Future
  render_fidelity_padrao: Precise
  surface_appearance: true
  strip_embedded_textures_glb: true

politica:
  falha: continuar
  custo_max_min: 30
  seed_base: 20261113

lote:
  - id: prop.rift_portal.01
    tipo: modulo_cenario
    rota: import
    origem: art/export/prop_rift_portal.glb
    altura_metros: 3.704   # 13.2286 studs
    pivot: base
    limite_triangulos: 4800
    material: pbr
    qualidade: hero
    quantidade_cena: 1
    render_fidelity_roblox: Precise
    detalhe_alto:
      ativo: true
      subdiv_niveis: 1
      chanfro_bevel_m: 0.008
      crease_angulo_graus: 40
      ao_cavidade_forca: 0.38
    pbr_zonas:
      - nome: obsidian
        preset: cristal_arcano
        cor_hex: "#262230"
        cor_tinta: "#262230"
        uv_faixa: [0, 0.75, 0.125, 0.875]
        metallic_override: 0.22
        roughness_escala: 0.75
        normal_forca: 1.1
      - nome: arcaneCyan
        preset: energia_espectral
        cor_hex: "#38e4f5"
        cor_tinta: "#38e4f5"
        uv_faixa: [0.125, 0.875, 0.25, 1]
        metallic_override: 0.1
        roughness_escala: 0.55
        normal_forca: 0.75
      - nome: tealDark
        preset: escamas_dragao
        cor_hex: "#0a4a46"
        cor_tinta: "#0a4a46"
        uv_faixa: [0.75, 0.375, 0.875, 0.5]
        metallic_override: 0.22
        roughness_escala: 1.0
        normal_forca: 1.15
      - nome: obsidianLight
        preset: pedra_musgo
        cor_hex: "#4e4660"
        cor_tinta: "#4e4660"
        uv_faixa: [0.125, 0.75, 0.25, 0.875]
        metallic_override: 0.14
        roughness_escala: 0.82
        normal_forca: 1.05
      - nome: eyeNeon
        preset: energia_espectral
        cor_hex: "#dcfff5"
        cor_tinta: "#dcfff5"
        uv_faixa: [0.375, 0.5, 0.5, 0.625]
        metallic_override: 0.08
        roughness_escala: 0.5
        normal_forca: 0.6
      - nome: arcaneViolet
        preset: cristal_arcano
        cor_hex: "#a855f7"
        cor_tinta: "#a855f7"
        uv_faixa: [0.25, 0.875, 0.375, 1]
        metallic_override: 0.12
        roughness_escala: 0.6
        normal_forca: 0.88
      - nome: stoneDark
        preset: pedra_musgo
        cor_hex: "#34383e"
        cor_tinta: "#34383e"
        uv_faixa: [0.125, 0, 0.25, 0.125]
        metallic_override: 0.0
        roughness_escala: 1.08
        normal_forca: 1.15
      - nome: tealSwarm
        preset: cristal_arcano
        cor_hex: "#2dd4bf"
        cor_tinta: "#2dd4bf"
        uv_faixa: [0.125, 0.5, 0.25, 0.625]
        metallic_override: 0.12
        roughness_escala: 0.7
        normal_forca: 0.95
      - nome: teal
        preset: escamas_dragao
        cor_hex: "#14b8a6"
        cor_tinta: "#14b8a6"
        uv_faixa: [0.625, 0.375, 0.75, 0.5]
        metallic_override: 0.18
        roughness_escala: 0.9
        normal_forca: 1.05
    suavizacao_normais:
      modo: hard_surface
      angulo_graus: 46
      weighted_normals: true
      corrective_smooth: false
    colisao: box
    seed: 20261113
    lod: [100]
    tags: [muralha, portal, rift]

