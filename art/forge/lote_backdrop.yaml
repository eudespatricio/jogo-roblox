# Cenario de fundo (alem da muralha) — Forge3D 0.6.1, rota mesh: concept SD1.5 -> TripoSR -> bake.
# Puramente visual, visto de longe: malha grosseira e aceitavel. Saida no sandbox do Forge3D.
# Rodar:
#   FORGE3D_I23D_REMOVER_FUNDO=1 FORGE3D_CONCEPT_NEGATIVO="$(cat art/forge/backdrop_negativo.txt)" \
#     ~/.local/bin/forge3d run art/forge/lote_backdrop.yaml --json
# v2: sem "diorama" (gerava chao/base e cena cortada -> malha deitada).
schema: forge3d/spec@4

projeto: muralha
perfil: roblox-r15
destino_exportacao: ~/.local/state/forge3d/saida/muralha_backdrop
estilo_global: lowpoly_lit

politica:
  falha: continuar
  custo_max_min: 30
  seed_base: 20261114

lote:
  - id: backdrop.castle.01
    tipo: prop_estatico
    rota: mesh
    prompt: >-
      small stone castle with three round towers and blue cone roofs,
      single isolated object, full object in frame, white background, low poly toy, three-quarter view
    altura_metros: 10
    pivot: base
    limite_triangulos: 3000
    material: pbr
    colisao: none
    seed: 20261114
    lod: [100]
    tags: [muralha, backdrop, castelo]

