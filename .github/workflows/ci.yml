name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rokit
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Instalar ferramentas fixadas
        run: rokit install --no-trust-check

      - name: Instalar luau-lsp
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip \
            -o /tmp/luau-lsp.zip
          python3 -m zipfile -e /tmp/luau-lsp.zip /tmp/luau-lsp
          bin="$(find /tmp/luau-lsp -type f -name luau-lsp | head -1)"
          install -m755 "$bin" "$HOME/.local/bin/luau-lsp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check
        run: bash scripts/check.sh

      - name: Guardar place
        uses: actions/upload-artifact@v4
        with:
          name: place
          path: build/place.rbxl
