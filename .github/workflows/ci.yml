name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rokit
        run: |
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Instalar ferramentas fixadas
        run: rokit install --no-trust-check

      - name: Baixar definicoes Roblox (globalTypes)
        run: bash scripts/fetch-roblox-types.sh

      - name: Check
        run: bash scripts/check.sh

      - name: Guardar place
        uses: actions/upload-artifact@v4
        with:
          name: place
          path: build/place.rbxl
